<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Talent Search – Entry Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#111418;--mut:#4f5d6b;--line:#d3dde8;--pri:#1768b3;--lnk:#1768b3;--pk:#fff;--chip:#f47b20;--chipk:#111;--soft:#e7f0f9;--bad:#b3261e;--ok:#1f8a4c;--okbg:#d6f0df;--okfg:#0d4d27;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141c;--card:#132130;--ink:#e6eef5;--mut:#98abbd;--line:#25394c;--pri:#1768b3;--lnk:#6db3f2;--pk:#fff;--chip:#f47b20;--chipk:#111;--soft:#14283c;--bad:#ff8a80;--ok:#3fbf75;--okbg:#17432c;--okfg:#bff0d0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141c;--card:#132130;--ink:#e6eef5;--mut:#98abbd;--line:#25394c;--pri:#1768b3;--lnk:#6db3f2;--pk:#fff;--chip:#f47b20;--chipk:#111;--soft:#14283c;--bad:#ff8a80;--ok:#3fbf75;--okbg:#17432c;--okfg:#bff0d0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#1768b3;color:#fff;padding:10px 16px}
header .in{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
header img{height:46px;max-width:100%;margin-right:auto;display:block}
header button{background:none;border:0;color:inherit;font:inherit;padding:6px 2px;cursor:pointer;border-bottom:2px solid transparent;opacity:.8}
header button.on{border-color:var(--chip);opacity:1}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:8px 0 10px;font-weight:800}
h2{font-size:22px;margin:0 0 12px}h3{margin:0 0 6px;font-size:18px}
p{margin:0 0 12px}.mut{color:var(--mut)}.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid .card{margin:0;display:flex;flex-direction:column;align-items:flex-start}.grid .card p{flex:1}
label{display:block;font-weight:500;font-size:14px;margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0}
label.ck{font-weight:400;font-size:15px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--chip);outline-offset:1px}
.row{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
button.b{background:var(--pri);color:var(--pk);border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:none;color:var(--lnk);border:1px solid var(--lnk);border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
button.s{padding:4px 10px;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--pk);border-color:var(--pri)}
.eid{display:inline-flex;align-items:stretch;font-weight:800;font-variant-numeric:tabular-nums;border-radius:6px;overflow:hidden;border:1px solid var(--pri);white-space:nowrap}
.eid i{font-style:normal;padding:2px 7px;background:var(--pri);color:#fff}
.eid u{text-decoration:none;padding:2px 7px;background:var(--chip);color:var(--chipk)}
.eid.big{font-size:34px}.eid.big i,.eid.big u{padding:4px 14px}
.code{display:inline-block;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.12em;padding:4px 18px;border-radius:6px;background:var(--pri);color:#fff}
.flash{background:var(--soft);border:1px solid var(--pri);border-radius:8px;padding:14px;margin-bottom:16px}
.err{color:var(--bad);font-weight:500;min-height:22px;margin:8px 0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);white-space:nowrap}
.stu{border-left:3px solid var(--chip);padding-left:12px;margin-bottom:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--soft);font-size:12px}
.chk{display:flex;flex-wrap:wrap;gap:2px 18px;margin-bottom:12px}
.note{background:var(--soft);border-left:4px solid var(--chip);border-radius:6px;padding:10px 12px;margin:0 0 14px}
a{color:var(--lnk)}
</style>
</head>

function runAssign(){const E=S.entries,J=S.judges,load={},A={},warn=[];J.forEach(j=>load[j.code]=0);
 const info=E.map(e=>{const ok=J.filter(j=>!conflict(j,e));return{e,ok,pref:ok.filter(j=>isPref(j,e))}});
 info.sort((a,b)=>a.pref.length-b.pref.length||a.ok.length-b.ok.length);
 const pick=(arr,n,ex,e)=>arr.filter(j=>!ex.includes(j.code)).sort((a,b)=>(uncertain(a,e)?1:0)-(uncertain(b,e)?1:0)||load[a.code]-load[b.code]||Math.random()-.5).slice(0,n);
 info.forEach(x=>{let ch=pick(x.pref,2,[],x.e);if(ch.length<2)ch=ch.concat(pick(x.ok,2-ch.length,ch.map(j=>j.code),x.e));
  if(ch.length<2)warn.push(x.e.id+" only has "+ch.length+" eligible judge"+(ch.length===1?"":"s"));
  A[x.e.id]=ch.map(j=>j.code);ch.forEach(j=>load[j.code]++)});
 for(const mode of [0,1,2,3]){const target=mode>1?2:1;
  for(let it=0;it<8000;it++){const codes=Object.keys(load).sort((a,b)=>load[b]-load[a]);let moved=false;
   if(!codes.length||load[codes[0]]-load[codes[codes.length-1]]<=target)break;
   find:for(const gc of codes){for(const rc of[...codes].reverse()){if(load[gc]-load[rc]<=target)continue;
    for(const x of info){const t=A[x.e.id];if(!t.includes(gc)||t.includes(rc))continue;const r=x.ok.find(j=>j.code===rc);if(!r)continue;const u=!!uncertain(r,x.e),pf=isPref(r,x.e);if(![pf&&!u,pf,!u,true][mode])continue;
     t[t.indexOf(gc)]=rc;load[gc]--;load[rc]++;moved=true;break find}}}
   if(!moved)break}}
 return{A,load,warn}}
