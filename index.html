<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Talent Search – Entry Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#111418;--mut:#4f5d6b;--line:#d3dde8;--pri:#1768b3;--lnk:#1768b3;--pk:#fff;--chip:#f47b20;--chipk:#111;--soft:#e7f0f9;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141c;--card:#132130;--ink:#e6eef5;--mut:#98abbd;--line:#25394c;--pri:#1768b3;--lnk:#6db3f2;--pk:#fff;--chip:#f47b20;--chipk:#111;--soft:#14283c;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141c;--card:#132130;--ink:#e6eef5;--mut:#98abbd;--line:#25394c;--pri:#1768b3;--lnk:#6db3f2;--pk:#fff;--chip:#f47b20;--chipk:#111;--soft:#14283c;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#1768b3;color:#fff;padding:10px 16px}
header .in{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
header img{height:46px;max-width:100%;margin-right:auto;display:block}
header button{background:none;border:0;color:inherit;font:inherit;padding:6px 2px;cursor:pointer;border-bottom:2px solid transparent;opacity:.8}
header button.on{border-color:var(--chip);opacity:1}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:8px 0 10px;font-weight:800}
h2{font-size:22px;margin:0 0 12px}h3{margin:0 0 6px;font-size:18px}
p{margin:0 0 12px}.mut{color:var(--mut)}.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid .card{margin:0;display:flex;flex-direction:column;align-items:flex-start}.grid .card p{flex:1}
label{display:block;font-weight:500;font-size:14px;margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0}
label.ck{font-weight:400;font-size:15px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--chip);outline-offset:1px}
.row{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
button.b{background:var(--pri);color:var(--pk);border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:none;color:var(--lnk);border:1px solid var(--lnk);border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
button.s{padding:4px 10px;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--pk);border-color:var(--pri)}
.eid{display:inline-flex;align-items:stretch;font-weight:800;font-variant-numeric:tabular-nums;border-radius:6px;overflow:hidden;border:1px solid var(--pri);white-space:nowrap}
.eid i{font-style:normal;padding:2px 7px;background:var(--pri);color:#fff}
.eid u{text-decoration:none;padding:2px 7px;background:var(--chip);color:var(--chipk)}
.eid.big{font-size:34px}.eid.big i,.eid.big u{padding:4px 14px}
.code{display:inline-block;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.12em;padding:4px 18px;border-radius:6px;background:var(--pri);color:#fff}
.flash{background:var(--soft);border:1px solid var(--pri);border-radius:8px;padding:14px;margin-bottom:16px}
.err{color:var(--bad);font-weight:500;min-height:22px;margin:8px 0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);white-space:nowrap}
.stu{border-left:3px solid var(--chip);padding-left:12px;margin-bottom:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--soft);font-size:12px}
.chk{display:flex;flex-wrap:wrap;gap:2px 18px;margin-bottom:12px}
.note{background:var(--soft);border-left:4px solid var(--chip);border-radius:6px;padding:10px 12px;margin:0 0 14px}
a{color:var(--lnk)}
</style>
</head>

const tbl=(h,r)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.join("")||`<tr><td colspan="${h.length}" class="mut">Nothing here yet.</td></tr>`}</table></div>`;
function aMaster(){return tbl(["Entry ID","Category","Age division","Title","Type","Students","School","Coordinator","Project","Publication","Judge link"],S.entries.map(e=>{const s=S.schools.find(x=>x.code===e.school)||{};
 return `<tr><td>${eid(e.id)}</td><td>${esc(e.cat)}</td><td>${esc(e.age)}</td><td>${esc(e.title)}</td><td>${e.type}</td><td>${esc(e.students.map(x=>x.n+" ("+x.y+")").join(", "))}</td><td>${esc(s.name)}</td><td>${esc(s.coord)}<br><span class="mut">${esc(s.email)}</span></td><td>${lnk(e)}</td><td>${e.pub?"Yes":"No"}</td><td><button class="g s" onclick="sub='${e.token}';view='jv';render()">Preview</button> <button class="g s" onclick="copyLink('${e.token}')">Copy link</button></td></tr>`}))}
let fc=CATS[0],fa=AGES[0];
function aCat(){const r=S.entries.filter(e=>e.cat===fc&&e.age===fa);
 return `<div class="row" style="max-width:560px"><label>Category<select onchange="fc=this.value;render()">${opts(CATS,fc)}</select></label><label>Age division<select onchange="fa=this.value;render()">${opts(AGES,fa)}</select></label></div>
 <p class="mut small">${r.length} ${r.length===1?"entry":"entries"} in this sheet. Student and school details are left out, matching your category sheets.</p>`+tbl(["Entry ID","Title","Summary","Project"],r.map(e=>`<tr><td>${eid(e.id)}</td><td>${esc(e.title)}</td><td>${esc(e.summary)}</td><td>${lnk(e)}</td></tr>`))}
function aSchools(){return tbl(["Code","School","Coordinator","Email","Phone","Students","Expected entries","Expected judges","Entries so far"],S.schools.map(s=>`<tr><td>${s.code}</td><td>${esc(s.name)}</td><td>${esc(s.coord)}</td><td>${esc(s.email)}</td><td>${esc(s.phone)}</td><td>${esc(s.ns)}</td><td>${esc(s.ne)}</td><td>${esc(s.nj)}</td><td>${S.entries.filter(e=>e.school===s.code).length}</td></tr>`))}
function aJudges(){return tbl(["Code","Name","Email","Phone","Organisation","Judged in last 5 years","Categories","Age divisions","Disciplines","Conflict of interest","Students entered"],S.judges.map(j=>`<tr><td>${j.code}</td><td>${esc(j.name)}</td><td>${esc(j.email)}</td><td>${esc(j.phone)}</td><td>${esc(j.org)}</td><td>${j.prev}</td><td>${esc(j.cats.join(", "))}</td><td>${esc(j.ages.join(", "))}</td><td>${esc((j.disc||[]).join(", "))}</td><td>${j.coi==="Yes"?esc(j.coiNote||"Yes"):"No"}</td><td>${j.teach==="Yes"?esc((j.tCats||[]).join(", ")+" / "+(j.tAges||[]).join(", ")):"No"}</td></tr>`))}

function route(){const m=location.hash.match(/^#e-(\w+)$/);if(m){view="jv";sub=m[1]}render();if(view==="school"&&sub==="new")studs()}
addEventListener("hashchange",route);
const _r=render;render=function(){_r();if(view==="school"&&sub==="new"&&g("studs"))studs()};
async function init(){
 if(!CONFIGURED){g("app").innerHTML='<div class="card"><h2>Almost there</h2><p>Open <b>index.html</b> in a text editor and paste your Supabase URL and key near the top of the script. README.md, step 4, shows where to find them.</p></div>';return}
 try{const {data}=await sb.auth.getSession();if(data.session&&await rpc("is_admin")){await loadAdmin();adm=true}}catch(e){}
 route()}
init();
</script>
